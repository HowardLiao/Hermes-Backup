name: Hermes-Backup CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check Python server
        run: |
          python3 -m py_compile server.py
      - name: Validate Bash scripts
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
      - name: Test completed
        run: echo "Hermes-Backup scripts validation passed!"
